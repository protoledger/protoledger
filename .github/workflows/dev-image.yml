name: dev-image

# Образ ghcr.io/protoledger/protoledger:dev — движок с Swagger UI и режимом serve --dev для работы над
# интерфейсом и для общего dev-сервера команды (ADR 0011, 0014). Не для жюри.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Есть ли код движка
        id: ready
        run: |
          if [ -f backend/Cargo.toml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "Сабмодуль backend без кода — пропускаю"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.ready.outputs.ok == 'true'
      - uses: docker/login-action@v3
        if: steps.ready.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.ready.outputs.ok == 'true'
        with:
          context: .
          file: Dockerfile.dev
          push: true
          tags: ghcr.io/${{ github.repository }}:dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
