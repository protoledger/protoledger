name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Формат заголовка PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$TITLE" | grep -qE '^(feat|fix|refactor|perf|test|docs|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+' \
            || { echo "Заголовок PR: <тип>(<скоуп>): <описание по-русски>"; exit 1; }
          printf '%s' "$TITLE" | grep -qP '\p{Cyrillic}' || { echo "Описание в заголовке PR — по-русски"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Есть ли что собирать
        id: ready
        run: |
          if [ -f backend/Cargo.toml ] && [ -f frontend/package.json ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "Сабмодули ещё без кода — сборку пропускаю"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.ready.outputs.ok == 'true'
      - name: Сборка образа
        if: steps.ready.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Смоук-тест
        if: steps.ready.outputs.ok == 'true'
        run: |
          # Те же ограничения, что в compose.yaml: корень только для чтения, без привилегий.
          # Папка проектов — как у пользователя после клона: ./workspace из репо, контейнер от его uid.
          docker run -d --name app -p 127.0.0.1:8080:8080 -v "$PWD/workspace:/data" --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then break; fi
            [ "$i" = 30 ] && { docker logs app; exit 1; }
            sleep 2
          done
          # Запись проекта в смонтированную папку работает и при read-only корне.
          token=$(curl -fsS http://127.0.0.1:8080/ | grep -o 'protoledger-token" content="[^"]*' | cut -d'"' -f3)
          curl -fsS -X POST http://127.0.0.1:8080/api/project -H "X-Protoledger-Token: $token" \
            -H 'Content-Type: application/json' -d '{"path":"smoke.protoledger","mode":"create"}' >/dev/null \
            || { docker logs app; exit 1; }
          test -d workspace/smoke.protoledger
      - name: В релизной сборке нет инструментов разработки
        if: steps.ready.outputs.ok == 'true'
        run: |
          docker create --name probe app:ci
          docker cp probe:/usr/local/bin/protoledger /tmp/protoledger
          docker rm probe
          bash backend/scripts/check-release-clean.sh /tmp/protoledger
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/docs/)
          [ "$code" = "404" ] || { echo "/api/docs/ вернул $code, ожидался 404"; exit 1; }
      - name: Эталоны examples/ (apply совпадает с expected)
        if: steps.ready.outputs.ok == 'true'
        run: bash examples/check.sh docker run --rm -v "$PWD/examples:/examples:ro" app:ci
      - name: Проект примера воспроизводится (verify) и даёт тот же отчёт
        if: steps.ready.outputs.ok == 'true'
        run: |
          run() { docker run --rm -v "$PWD/examples:/examples:ro" app:ci "$@"; }
          run verify /examples/thermostand/project/thermostand.protoledger
          run report /examples/thermostand/project/thermostand.protoledger --format md > /tmp/report.md
          diff /tmp/report.md examples/thermostand/project/report.md
      - name: Проект примера собирается заново через API и совпадает с закоммиченным
        if: steps.ready.outputs.ok == 'true'
        run: |
          node examples/thermostand/build-project.mjs /tmp/protoledger
          git status --short examples/thermostand/project
          git diff --exit-code -- examples/thermostand/project
          test -z "$(git status --short examples/thermostand/project)"
      - name: Черновик описания по записям исследования разбирает дополнительную запись
        if: steps.ready.outputs.ok == 'true'
        run: |
          S=examples/thermostand/sample_protocol
          /tmp/protoledger draft             --input $S/research/01_configuration.pcap --input $S/research/02_variations.pcapng             --input $S/research/03_combined_messages.pcap             --action-log $S/action_journal.csv --mapping examples/thermostand/mapping.yaml             --out /tmp/draft.yaml
          /tmp/protoledger apply --interpretation /tmp/draft.yaml             --input $S/additional/04_new_observations.pcapng             --action-log $S/action_journal.csv --mapping examples/thermostand/mapping.yaml             --strict > /tmp/draft-apply.json
          jq -e '.summary.messages == 16 and ([.hypotheses[] | select(.verdict == "refuted")] | length) == 0 and (.hypotheses | length) >= 15' /tmp/draft-apply.json
      - name: Записи примеров modbus и mqtt воспроизводятся генераторами
        if: steps.ready.outputs.ok == 'true'
        run: |
          node examples/modbus/generate.mjs
          node examples/mqtt/generate.mjs
          git diff --exit-code -- examples/modbus examples/mqtt
          test -z "$(git status --short examples/modbus examples/mqtt)"
      - name: Замеры в профиле 4 vCPU / 8 ГиБ
        if: steps.ready.outputs.ok == 'true' && hashFiles('bench/run.sh') != ''
        run: bash bench/run.sh app:ci

  dev-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Есть ли код движка
        id: ready
        run: |
          if [ -f backend/Cargo.toml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "Сабмодуль backend без кода — пропускаю"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.ready.outputs.ok == 'true'
      - name: Сборка dev-образа
        if: steps.ready.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          load: true
          tags: app:dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
      - name: Смоук dev-режима
        if: steps.ready.outputs.ok == 'true'
        run: |
          mkdir -p /tmp/dev-data && chmod 777 /tmp/dev-data
          docker run -d --name dev -e PROTOLEDGER_DEV_TOKEN=ci-dev-token -p 8080:8080 -v /tmp/dev-data:/data app:dev
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS -H "X-Protoledger-Token: ci-dev-token" http://127.0.0.1:8080/api/jobs
          curl -fsS http://127.0.0.1:8080/api/docs/ >/dev/null
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/jobs)
          [ "$code" = "401" ] || { echo "без токена ожидался 401, получено $code"; docker logs dev; exit 1; }
          # Примеры в образе импортируются по пути, как на общем dev-сервере.
          api() { curl -fsS -H "X-Protoledger-Token: ci-dev-token" -H 'Content-Type: application/json' "$@"; }
          api -X POST -d '{"path":"ci.protoledger","mode":"create"}' http://127.0.0.1:8080/api/project >/dev/null
          job=$(api -X POST -d '{"path":"/examples/thermostand/sample_protocol/research/01_configuration.pcap"}'             http://127.0.0.1:8080/api/sources | grep -o '"jobId":"[^"]*"' | cut -d'"' -f4)
          for i in $(seq 1 30); do
            state=$(api "http://127.0.0.1:8080/api/jobs/$job" | grep -o '"state":"[a-z_]*"' | cut -d'"' -f4)
            [ "$state" = "succeeded" ] && break
            [ "$state" = "failed" ] && { api "http://127.0.0.1:8080/api/jobs/$job"; exit 1; }
            sleep 1
          done
          [ "$state" = "succeeded" ] || { echo "импорт примера не завершился: $state"; exit 1; }

  ci:
    if: always()
    needs: [pr-title, build, dev-image]
    runs-on: ubuntu-latest
    steps:
      - name: Итог
        run: |
          for r in "${{ needs.pr-title.result }}" "${{ needs.build.result }}" "${{ needs.dev-image.result }}"; do
            case "$r" in success|skipped) ;; *) echo "есть упавшие проверки: $r"; exit 1 ;; esac
          done
