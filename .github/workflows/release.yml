name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Сборка SPA
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm generate
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Сборка движка
        working-directory: backend
        shell: bash
        run: UI_DIST="$GITHUB_WORKSPACE/frontend/.output/public" cargo build --release --locked
      - name: Архив
        shell: bash
        run: |
          mkdir -p dist
          name="protoledger-${GITHUB_REF_NAME}-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp backend/target/release/protoledger.exe dist/ && (cd dist && 7z a "../$name.zip" protoledger.exe >/dev/null)
          else
            cp backend/target/release/protoledger dist/ && tar -czf "$name.tar.gz" -C dist protoledger
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: protoledger-*

  publish:
    needs: [image, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist && sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes "Сборка $GITHUB_REF_NAME. Образ: ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
