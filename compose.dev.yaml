# Движок в dev-режиме для фронтенда: Swagger UI на /api/docs, фиксированный токен, origin :3000.
#   docker compose -f compose.dev.yaml up --build
# Порт открыт только на localhost хоста.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      PROTOLEDGER_DEV_TOKEN: "${PROTOLEDGER_DEV_TOKEN:-dev-token-local}"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./workspace:/data
    restart: unless-stopped
