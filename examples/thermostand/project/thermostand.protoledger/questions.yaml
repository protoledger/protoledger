- id: q-1
  text: Порог знаковый или беззнаковый?
  status: closed
  answer: "Знаковый (i16): отрицательные пороги из журнала совпадают с байтами только при знаковом чтении."
- id: q-2
  text: >-
    Есть ли у устройства команды кроме 0x10, 0x20 и 0x30? В записях другие коды
    встречаются только в контрольной отправке клиента, устройство отвечает статусом 1.
  status: open
  answer: null
