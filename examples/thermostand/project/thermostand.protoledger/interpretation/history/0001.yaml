# Термостенд: интерпретация протокола, восстановленная по набору организаторов.
format: protoledger/interpretation@1
scope:
  direction: any
  filter: "dst_port == 46123 || src_port == 46123"
framing:
  kind: length_prefixed
  length: { at: 2, type: u16be, adjust: 8 }
  sync: "a65c"
  status: rule
messages:
  - id: read_config_req
    description: Запрос настроек
    when: "dir == 0 && cmd == 0x10"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "a65c", status: rule }
      - { name: length, at: 2, type: u16be, status: rule, description: "длина тела без 8-байтового заголовка" }
      - { name: seq, at: 4, type: u16be, status: hypothesis, hypothesis: H1 }
      - { name: dir, at: 6, type: u8, status: hypothesis, hypothesis: H2 }
      - { name: cmd, at: 7, type: u8, status: hypothesis, hypothesis: H3 }
  - id: set_config_req
    description: Изменение настроек
    when: "dir == 0 && cmd == 0x20"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "a65c", status: rule }
      - { name: length, at: 2, type: u16be, status: rule }
      - { name: seq, at: 4, type: u16be, status: hypothesis, hypothesis: H1 }
      - { name: dir, at: 6, type: u8, status: hypothesis, hypothesis: H2 }
      - { name: cmd, at: 7, type: u8, status: hypothesis, hypothesis: H3 }
      - { name: enabled, at: 8, type: u8, status: hypothesis, hypothesis: H4 }
      - { name: period_ms, at: 9, type: u16be, status: hypothesis, hypothesis: H5 }
      - { name: threshold_centi_c, at: 11, type: u16be, status: hypothesis, hypothesis: H6 }
      - { name: label_len, at: 13, type: u8, status: hypothesis, hypothesis: H7 }
      - { name: label, at: 14, type: string, len: "label_len", status: hypothesis, hypothesis: H7 }
  - id: read_values_req
    description: Запрос измерений
    when: "dir == 0 && cmd == 0x30"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "a65c", status: rule }
      - { name: length, at: 2, type: u16be, status: rule }
      - { name: seq, at: 4, type: u16be, status: hypothesis, hypothesis: H1 }
      - { name: dir, at: 6, type: u8, status: hypothesis, hypothesis: H2 }
      - { name: cmd, at: 7, type: u8, status: hypothesis, hypothesis: H3 }
      - { name: count, at: 8, type: u8, status: hypothesis, hypothesis: H8 }
  - id: unknown_command_req
    description: Команда вне известных (контрольная отправка клиента)
    when: "dir == 0 && cmd != 0x10 && cmd != 0x20 && cmd != 0x30"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "a65c", status: rule }
      - { name: length, at: 2, type: u16be, status: rule }
      - { name: seq, at: 4, type: u16be, status: hypothesis, hypothesis: H1 }
      - { name: dir, at: 6, type: u8, status: hypothesis, hypothesis: H2 }
      - { name: cmd, at: 7, type: u8, status: unknown }
      - { name: body, at: 8, type: unknown, len: "length" }
  - id: config_resp
    description: Настройки устройства (ответ на чтение и на изменение)
    when: "dir == 1 && (cmd == 0x10 || cmd == 0x20) && status == 0"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "a65c", status: rule }
      - { name: length, at: 2, type: u16be, status: rule }
      - { name: seq, at: 4, type: u16be, status: hypothesis, hypothesis: H1 }
      - { name: dir, at: 6, type: u8, status: hypothesis, hypothesis: H2 }
      - { name: cmd, at: 7, type: u8, status: hypothesis, hypothesis: H3 }
      - { name: status, at: 8, type: u8, status: hypothesis, hypothesis: H9 }
      - { name: enabled, at: 9, type: u8, status: hypothesis, hypothesis: H4 }
      - { name: period_ms, at: 10, type: u16be, status: hypothesis, hypothesis: H5 }
      - { name: threshold_centi_c, at: 12, type: u16be, status: hypothesis, hypothesis: H6 }
      - { name: label_len, at: 14, type: u8, status: hypothesis, hypothesis: H7 }
      - { name: label, at: 15, type: string, len: "label_len", status: hypothesis, hypothesis: H12 }
  - id: values_resp
    description: Порция измерений, по 7 байт на измерение
    when: "dir == 1 && cmd == 0x30 && status == 0"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "a65c", status: rule }
      - { name: length, at: 2, type: u16be, status: rule }
      - { name: seq, at: 4, type: u16be, status: hypothesis, hypothesis: H1 }
      - { name: dir, at: 6, type: u8, status: hypothesis, hypothesis: H2 }
      - { name: cmd, at: 7, type: u8, status: hypothesis, hypothesis: H3 }
      - { name: status, at: 8, type: u8, status: hypothesis, hypothesis: H9 }
      - { name: count, at: 9, type: u8, status: hypothesis, hypothesis: H8 }
      - name: measurements
        at: 10
        type: bytes
        status: hypothesis
        hypothesis: H10
        repeat:
          count: "count"
          fields:
            - { name: device_time_ms, at: 0, type: u32be, status: hypothesis, hypothesis: H10 }
            - { name: temperature_centi_c, at: 4, type: i16be, status: hypothesis, hypothesis: H10 }
            - { name: alarm, at: 6, type: u8, status: hypothesis, hypothesis: H11 }
  - id: error_resp
    description: Отказ устройства — только код статуса
    when: "dir == 1 && status != 0"
    fields:
      - { name: signature, at: 0, type: bytes, len: 2, expect: "a65c", status: rule }
      - { name: length, at: 2, type: u16be, status: rule }
      - { name: seq, at: 4, type: u16be, status: hypothesis, hypothesis: H1 }
      - { name: dir, at: 6, type: u8, status: hypothesis, hypothesis: H2 }
      - { name: cmd, at: 7, type: u8, status: hypothesis, hypothesis: H3 }
      - { name: status, at: 8, type: u8, status: hypothesis, hypothesis: H9 }
hypotheses:
  - { id: H1, statement: "seq — номер запроса от 1, ответ повторяет номер своего запроса", test: "seq == response.seq" }
  - { id: H2, statement: "dir — 0 запрос клиента, 1 ответ устройства" }
  - { id: H3, statement: "cmd — команда: 0x10 чтение настроек, 0x20 изменение настроек, 0x30 чтение измерений; ответ повторяет команду", test: "cmd == response.cmd" }
  - { id: H4, statement: "enabled — 1 измерения включены, 0 выключены", test: "enabled == action.params.enabled" }
  - { id: H5, statement: "period_ms — период измерений в миллисекундах, u16 старшим байтом вперёд", test: "period_ms == action.params.period_ms" }
  - { id: H6, statement: "threshold_centi_c — температурный порог в сотых долях градуса Цельсия, знаковое 16 бит", test: "threshold_centi_c == dec(action.params.threshold_c, 2)" }
  - { id: H7, statement: "label — метка устройства в UTF-8, длина в байтах в label_len", test: "label == action.params.label" }
  - { id: H8, statement: "count — число запрошенных или переданных измерений", test: "count == action.params.count" }
  - { id: H9, statement: "status — 0 ок, 1 неподдерживаемая команда, 2 некорректное тело, 3 значение вне диапазона, 4 измерения отключены", test: "(status == 0) == (action.result.status == \"ok\")" }
  - { id: H10, statement: "измерение — 7 байт: время устройства u32 мс, температура i16 в сотых °C, признак тревоги u8", test: "measurements.0.device_time_ms == action.result.measurements.0.device_time_ms && measurements.0.temperature_centi_c == dec(action.result.measurements.0.temperature_c, 2)" }
  - { id: H11, statement: "alarm — 1, если температура достигла порога или превысила его", test: "measurements.0.alarm == action.result.measurements.0.alarm" }
  - { id: H12, statement: "ответ с настройками передаёт текущую конфигурацию устройства", test: "enabled == action.result.configuration.enabled && period_ms == action.result.configuration.period_ms && threshold_centi_c == dec(action.result.configuration.threshold_c, 2) && label == action.result.configuration.label" }
checks:
  - { id: C1, kind: structural, expr: "length + 8 == message.len", description: "длина в заголовке не совпадает с размером сообщения" }
  - { id: C2, kind: structural, expr: "label_len + 6 == length", message: set_config_req, description: "метка не заканчивает тело запроса" }
  - { id: C3, kind: structural, expr: "count * 7 + 2 == length", message: values_resp, description: "число измерений не сходится с длиной тела" }
